
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./docker/config/otel-collector.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"  
      - "4318:4318"  
      - "8888:8888"  
    networks:
      - observability-network
    depends_on:
      - jaeger
      - victoria-metrics

  # Metrics
  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    ports:
      - "8428:8428"
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
    networks:
      - observability-network

  # Logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - observability-network

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - observability-network

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.0
    container_name: logstash
    user: root  # Set user to root to avoid permission issues
    volumes:
      - ./docker/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline
      - ./docker/logstash/data:/usr/share/logstash/data
      - ./logs:/usr/share/logstash/logs
    ports:
      - "5000:5000"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    networks:
      - observability-network
    depends_on:
      - elasticsearch

  # fluentd:
  #   build:
  #     context: ./docker/config/fluentd
  #     dockerfile: Dockerfile
  #   volumes:
  #     - ./docker/config/fluentd/conf:/fluentd/etc
  #   ports:
  #     - "24224:24224"
  #   depends_on:
  #     - elasticsearch
  #   networks:
  #     - observability-network
  # Traces
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # UI
      - "14250:14250"  # Collector
      - "14268:14268"  # HTTP collector
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - observability-network

  # Visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./docker/config/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - victoria-metrics
      - jaeger
      - elasticsearch
    networks:
      - observability-network

  auth-service:
      build:
        context: ./services/auth-service
        dockerfile: Dockerfile
      container_name: auth-service
      environment:
        - SPRING_APPLICATION_NAME=auth-service
        - SERVER_PORT=18005
        - SPRING_DATASOURCE_URL=jdbc:postgresql://37.27.65.240:15432/auth_db
        - SPRING_DATASOURCE_USERNAME=postgres
        - SPRING_DATASOURCE_PASSWORD=postgres
        - KEYCLOAK_AUTH_SERVER_URL=https://api.screenera.ai/auth
        - KEYCLOAK_REALMS_SUPER_ADMIN=super-admin-realm
        - KEYCLOAK_REALMS_TENANT=tenant-realm
        - KEYCLOAK_REALMS_CANDIDATE=candidate-realm
        - OTEL_SERVICE_NAME=auth-service
        - OTEL_RESOURCE_ATTRIBUTES=service.name=auth-service,service.version=1.0.0
        - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
        - OTEL_METRICS_EXPORTER=otlp
        - OTEL_LOGS_EXPORTER=otlp
        - OTEL_TRACES_EXPORTER=otlp
        - OTEL_JAVAAGENT_DEBUG=false
        - OTEL_INSTRUMENTATION_JDBC_ENABLED=true
        - LOGGING_CONFIG=classpath:logback-spring.xml
        - FLUENTD_HOST=fluentd
        - FLUENTD_PORT=24224
      ports:  # Change expose to ports
        - "18005:18005"  # Format is "HOST_PORT:CONTAINER_PORT" 
      depends_on:
      - otel-collector
      - logstash
      volumes:
      - ./logs:/app/logs
      networks:
        - observability-network
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:18005/actuator/health"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 40s

  # Correlation Engine
  correlation-engine:
    build:
      context: ./services/correlation-engine
    environment:
      - NODE_ENV=development
      - JAEGER_URL=http://jaeger:16686
      - VICTORIA_METRICS_URL=http://victoria-metrics:8428
      - MONGODB_URL=mongodb+srv://akshaywaghmarecc:moENbPMhfQa2u035@cluster0.h0kcr6g.mongodb.net/correlation-engine
      - AI_ANALYZER_URL=http://ai-analyzer:3002
      - LOG_LEVEL=debug
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3001:3001"
    depends_on:
      - jaeger
      - victoria-metrics
    networks:
