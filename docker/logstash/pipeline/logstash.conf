input {
  file {
    path => "/usr/share/logstash/logs/*.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
    codec => json
  }
}

filter {
  # Extract trace context for correlation
  if [trace_id] {
    mutate {
      add_field => { "[span_data][trace_id]" => "%{trace_id}" }
    }
  }
  
  if [span_id] {
    mutate {
      add_field => { "[span_data][span_id]" => "%{span_id}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "auth-service-%{+YYYY.MM.dd}"
  }
  # For debugging
  stdout { codec => rubydebug }
}
